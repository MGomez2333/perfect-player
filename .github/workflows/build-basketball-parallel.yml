name: Build basketball parallel
on:
  push:
    paths:
      - .github/workflows/build-basketball-parallel.yml
      - basketball-parallel/build.py
      - basketball-parallel/*patches.py
      - basketball-parallel/player-development.js
      - basketball-parallel/development-integration.js
      - basketball-parallel/draft-*.js
      - basketball-parallel/draft-countries.json
      - basketball-parallel/manager-*.js
      - basketball-parallel/progression-rules.js
      - basketball-parallel/player-shell.js
      - basketball-parallel/responsive.css
      - basketball-parallel/dynasty-source*
      - basketball-parallel/dynasty-home.*
      - basketball-parallel/dynasty-app.js
      - basketball-parallel/dynasty-template.js
      - basketball-parallel/dynasty-logos.js
      - basketball-parallel/tests/**
      - basketball-parallel/package*.json
  workflow_dispatch:
concurrency:
  group: basketball-parallel-build
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache original modules and images
        run: python basketball-parallel/build.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix basketball-parallel --ignore-scripts --no-audit --no-fund
      - name: Verify dynasty rules and compatibility
        run: |
          node basketball-parallel/tests/navigation.cjs
          node basketball-parallel/tests/draft-era.cjs
          node basketball-parallel/tests/draft-filters.cjs
          node basketball-parallel/tests/player-development.cjs
          node basketball-parallel/tests/development-worker.cjs
          node basketball-parallel/tests/dynasty-rewards.cjs
          node basketball-parallel/tests/expansion-r37.cjs
          node basketball-parallel/tests/storage-compat.cjs
          node basketball-parallel/tests/player-shell.cjs
          node --experimental-vm-modules basketball-parallel/tests/era-history.cjs
          python basketball-parallel/tests/china-portraits.py
      - name: Publish cached game
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add basketball-parallel
          git diff --cached --quiet || git commit -m 'Publish basketball parallel with local image assets'
          git pull --rebase origin main
          git push

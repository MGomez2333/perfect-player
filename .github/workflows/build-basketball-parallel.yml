name: Build basketball parallel
on:
  push:
    paths:
      - basketball-parallel/build.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache original modules and images
        run: python basketball-parallel/build.py
      - name: Publish cached game
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add basketball-parallel
          git diff --cached --quiet || git commit -m 'Publish basketball parallel with local image assets'
          git pull --rebase origin main
          git push
